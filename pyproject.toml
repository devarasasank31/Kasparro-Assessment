[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "1.0.0"
description = "AI Resume Screening & Ranking System - deterministic hard filtering with optional LLM and GitHub enrichment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.6,<3.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
screen-resumes = "resume_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
