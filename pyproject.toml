[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "1.0.0"
description = "AI Resume Screening & Ranking System - deterministic hard filtering with optional LLM and GitHub enrichment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.6,<3.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
screen-resumes = "resume_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W  correctness + pyflakes + warnings
# I      import sorting
# UP     modern Python syntax (3.10+)
# B/BLE  common bugs and intentional broad excepts (kept explicit with noqa)
# SIM    simplifications that stay readable
# RUF    ruff-specific catches (unused noqa, redundant casts, ...)
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    "E501",     # long evidence strings and prompts are intentional
    "RUF001",   # unicode arrows/ellipses in prose are intentional
    "RUF002",
    "RUF003",
    "SIM105",   # contextlib.suppress is not clearer than try/except/pass here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
# The pipeline is typed at the module/function boundary; dict-shaped JSON
# records stay loosely typed on purpose.
check_untyped_defs = false
